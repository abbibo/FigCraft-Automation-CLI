[package]
name = "palette-swatch-grid"
version = "1.0.0"
edition = "2021"
description = "FigCraft WebAssembly Plugin to generate palette swatches"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# FigCraft plugins run inside wasmi without OS/WASI, so we keep dependencies no_std
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1
panic = "abort"
